[project]
name = "pysitegen"
version = "0.1.0"
description = "A tiny Python-authored static site generator for terminal-inspired static web pages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ujjwal Vivek" }]
keywords = [
    "cli",
    "html",
    "python",
    "static-site-generator",
    "website",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://pysitegen.ujjwalvivek.com"
Repository = "https://github.com/ujjwalvivek/pysitegen"
Issues = "https://github.com/ujjwalvivek/pysitegen/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pysitegen = "pysitegen.builder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysitegen = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
