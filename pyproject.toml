[project]
name = "pysitegen"
version = "0.1.0"
description = "A tiny Python-authored static site generator for terminal-inspired static web pages."
requires-python = ">=3.11"

[project.scripts]
pysitegen = "pysitegen.builder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysitegen = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
